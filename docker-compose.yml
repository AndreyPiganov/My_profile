name: my-profile

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-profile}
      POSTGRES_USER: ${POSTGRES_USER:-profile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profile}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-profile}:${POSTGRES_PASSWORD:-profile}@database:5432/${POSTGRES_DB:-profile}?schema=public
    depends_on:
      database:
        condition: service_healthy
    command: >-
      sh -c "set -e;
      npm run prisma:migrate:deploy;
      npm run prisma:seed"
    restart: "no"

  app:
    build:
      context: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-profile}:${POSTGRES_PASSWORD:-profile}@database:5432/${POSTGRES_DB:-profile}?schema=public
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true

volumes:
  postgres-data:
